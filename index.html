<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101317"><title>PPL Rotation | Training Tracker</title><style>
:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#e9edf1;background:#101317}*{box-sizing:border-box}body{margin:0}header{position:sticky;top:0;z-index:4;background:#101317ed;border-bottom:1px solid #30363d;backdrop-filter:blur(12px)}.wrap{max-width:1100px;margin:auto;padding:18px}header .wrap{display:flex;justify-content:space-between;align-items:center;gap:12px}.logo{font-size:19px;font-weight:800;letter-spacing:-.6px}.muted{color:#a4afb9}.tiny{font-size:12px}.tabs{display:flex;gap:7px;flex-wrap:wrap}.tab,.btn{border:1px solid #414b55;background:#20262c;color:#eaf0f5;border-radius:10px;padding:10px 14px;cursor:pointer;font-weight:650}.tab.active,.btn.primary{background:#d8f26a;color:#171d16;border-color:#d8f26a}.btn:disabled{opacity:.45;cursor:not-allowed}.btn.danger{border-color:#8e4545;color:#ffb2b2}.hero{display:flex;justify-content:space-between;gap:20px;align-items:center;margin:15px 0 22px}.hero h1{font-size:clamp(26px,4vw,38px);margin:4px 0 8px}.eyebrow{text-transform:uppercase;color:#d8f26a;letter-spacing:1.5px;font-size:12px;font-weight:750}.card{background:#1b2026;border:1px solid #353e47;border-radius:16px;padding:17px;margin-bottom:14px}.card h2{font-size:18px;margin:0 0 12px}.card h3{margin:0 0 7px;font-size:16px}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.between{justify-content:space-between}.pill{border:1px solid #49535b;border-radius:30px;padding:5px 9px;font-size:12px;color:#c7d0d9}.pill.good{color:#d8f26a;border-color:#788b4b}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.schedule{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.schedule div{border:1px solid #3a444e;border-radius:10px;padding:12px;text-align:center}.schedule .now{border-color:#d8f26a;background:#2b3425}.exercise{padding:17px 0;border-top:1px solid #343c44}.exercise:first-child{border-top:0}.exercise-head{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}.exercise-name{font-size:16px;font-weight:750}.meta{font-size:12px;color:#a7b1bc;margin-top:4px}.sets{display:grid;gap:7px;margin-top:12px}.set{display:grid;grid-template-columns:38px repeat(3,minmax(0,1fr));gap:8px;align-items:end}.field label{display:block;color:#9ca9b5;font-size:11px;margin:0 0 5px}.field input,.field select,textarea{width:100%;min-width:0;border:1px solid #48525d;border-radius:9px;background:#11171c;color:#f4f6f7;padding:10px;font:inherit}.field input:focus,.field select:focus{outline:2px solid #d8f26a;border-color:transparent}.setno{font-size:12px;color:#aab5be;padding-bottom:12px}.notice{padding:12px;border-radius:10px;background:#252e30;border-left:3px solid #d8f26a;color:#d8e4e5;font-size:13px;line-height:1.55}.result{border-top:1px solid #3a434a;padding:13px 0}.result:first-child{border-top:0}.result strong{display:block;margin-bottom:4px}.result p{margin:3px 0;color:#c6d0d9;font-size:13px;line-height:1.5}.empty{padding:30px;text-align:center;color:#aab5bf}.history-item{padding:12px 0;border-top:1px solid #3a434a}.history-item:first-child{border-top:0}.hide{display:none!important}.stat{padding:14px;border-radius:12px;background:#252d31;border:1px solid #3b454b}.stat b{font-size:24px;display:block;margin:5px 0}.progress{height:9px;background:#394149;border-radius:12px;overflow:hidden}.progress>div{height:100%;background:#d8f26a;border-radius:12px}.achievement{padding:12px;border:1px solid #424b53;border-radius:12px}.achievement.locked{opacity:.46}.achievement b{display:block;margin:5px 0}.footer{color:#8996a1;font-size:12px;padding:20px 0 40px}.btnsmall{padding:7px 9px;font-size:12px}input[type=file]{display:none}@media(max-width:700px){.wrap{padding:13px}.hero{align-items:flex-start}.grid{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}.schedule{grid-template-columns:repeat(2,1fr)}.tab{padding:9px 10px;font-size:12px}.card{padding:13px}.hero h1{font-size:27px}.set{gap:5px}.field input{padding:9px 6px;font-size:14px}}@media print{header,.actions,.btn{display:none!important}body{background:white;color:black}.card{border-color:#aaa;background:white}}
</style></head><body><header><div class="wrap"><div><div class="logo">PPL<span style="color:#d8f26a">/</span>TRACK</div><div class="tiny muted">4-day rotating training system</div></div><nav class="tabs" id="tabs"><button class="tab active" data-tab="today">Workout</button><button class="tab" data-tab="profile">My Journey</button><button class="tab" data-tab="prs">PR Benchmarks</button><button class="tab" data-tab="history">History</button><button class="tab" data-tab="settings">Data</button></nav></div></header><main class="wrap" id="app"></main><script>
'use strict';
const PLAN={
'Push A':[['Upper Chest Press (Plate-Loaded)',3,5,8,2],['Chest Press Machine',2,8,10,2],['Pec Fly',2,10,12,2],['Shoulder Press Machine',2,6,10,2],['Dumbbell Lateral Raise',3,10,15,2],['Rope Triceps Pushdown',3,8,12,2]],
'Push B':[['Upper Chest Press (Plate-Loaded)',3,8,10,2],['Decline Cable Fly',2,12,15,2],['Shoulder Press Machine',2,8,12,2],['Cable Lateral Raise',3,12,15,2],['Rope Triceps Pushdown',2,10,12,2],['Overhead Cable Triceps Extension',3,10,15,2],['Cable Triceps Kickback',2,12,15,2,true]],
'Pull A':[['Lat Pulldown',3,6,8,2],['Cable Row',3,8,10,2],['Rear Delt Pec Deck',3,10,15,2],['EZ-Bar Biceps Curl',3,8,10,2],['Dumbbell Curl',2,10,12,2],['Rope Cable Forearm Curl',2,12,15,2,true]],
'Pull B':[['Lat Pulldown',3,10,12,2],['Cable Row',3,10,12,2],['Cable Pullover',2,12,15,2],['Single-Arm Cable Rear Delt Fly',3,12,15,2],['Dumbbell Curl',2,10,12,2],['Single-Arm Cable Biceps Curl',3,10,15,2],['Rope Cable Forearm Curl',2,12,15,2,true]],
'Legs A':[['Linear Hack Press (kg per side)',3,6,8,2],['SLDL / RDL (barbell total kg)',2,8,10,3],['Leg Extension',3,10,15,2],['Standing Leg Curl (Plate-Loaded)',3,10,12,2],['V-Squat Calf Raise (kg per side)',3,10,15,2],['Dumbbell Lateral Raise',2,12,15,2,true]],
'Legs B':[['SLDL / RDL (barbell total kg)',3,6,8,3],['Linear Hack Press (kg per side)',2,8,10,3],['Leg Extension',2,12,15,2],['Standing Leg Curl (Plate-Loaded)',3,8,12,2],['V-Squat Calf Raise (kg per side)',3,10,15,2],['Dumbbell Lateral Raise',2,12,15,2,true]]};
const ORDER=['Push A','Pull A','Legs A','Push B','Pull B','Legs B']; // continuous six-session cycle; repeated 2x for 3 weeks
const KEY='ppl_track_v1';const load=()=>{try{return JSON.parse(localStorage.getItem(KEY))||{}}catch{return {}}};let state=Object.assign({index:0,history:[],prs:{},draft:{},notes:'',lastSummary:null,profile:{weight:70,height:170}},load());state.profile=Object.assign({weight:70,height:170},state.profile||{});let tab='today';let expandedHistory=-1;const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const save=()=>localStorage.setItem(KEY,JSON.stringify(state));const current=()=>ORDER[state.index%ORDER.length];const exercises=()=>PLAN[current()];const names=[...new Set(Object.values(PLAN).flat().map(e=>e[0]))];const key=(name,idx)=>name+'|'+idx;const isNum=x=>x!==''&&x!==null&&x!==undefined&&Number.isFinite(Number(x));const round=x=>Math.round(x*10)/10;const latestFor=(name)=>state.history.slice().reverse().flatMap(h=>h.entries||[]).find(e=>e.name===name&&e.sets?.length);
function inputCell(label,value,attr){return `<div class="field"><label>${label}</label><input ${attr} type="number" min="0" step="any" value="${esc(value??'')}"></div>`}
function render(){document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.tab===tab));$('app').innerHTML=tab==='today'?today():tab==='profile'?profileView():tab==='prs'?prs():tab==='history'?historyView():settings();}
function today(){const session=current(),n=state.index,seq=Array.from({length:4},(_,i)=>ORDER[(n+i)%ORDER.length]);return `<section class="hero"><div><div class="eyebrow">Selected workout · Flexible rotation</div><h1>${session}</h1><div class="muted">Log each working set · weights in kg · RIR = reps in reserve</div></div><span class="pill good">Next: ${ORDER[(n+1)%ORDER.length]}</span></section>${journeyStrip()}<div class="card"><h2>Choose today's workout</h2><div class="field" style="margin-bottom:14px"><label>Workout rotation (select any session)</label><select id="rotationSelect">${ORDER.map((s,i)=>`<option value="${i}" ${i===n%ORDER.length?'selected':''}>${s}</option>`).join('')}</select></div><h2>Upcoming rotation</h2><div class="schedule">${seq.map((s,i)=>`<div class="${i===0?'now':''}"><div class="tiny muted">${i?'+'+i+' session':'TODAY'}</div><b>${s}</b></div>`).join('')}</div><p class="tiny muted">Choose any workout above. Saving advances to the session after your selection. Your PRs and completed history stay unchanged.</p></div><div class="grid2"><div class="card"><h2>Workout date</h2>${`<div class="field"><label>Session date</label><input id="date" type="date" value="${esc(state.date||new Date().toLocaleDateString('en-CA'))}"></div>`}<p class="tiny muted">Use your local workout date; edit if logging an earlier session.</p></div><div class="card"><h2>Session note</h2><textarea id="notes" rows="3" placeholder="Energy, sleep, soreness, technique...">${esc(state.notes)}</textarea></div></div><div class="card"><div class="row between"><h2 style="margin:0">Working sets</h2><span class="pill">${exercises().filter(e=>!e[5]).length} core exercises</span></div><p class="tiny muted">Optional exercises may be skipped. PR benchmarks are separate and never automatically overwritten.</p>${exercises().map((e,i)=>exerciseCard(e,i)).join('')}</div><div class="card"><div class="row between"><div><h2>Finish workout</h2><p class="tiny muted">Saves your sets, generates next-session targets, and advances the rotation.</p></div><button class="btn primary" id="finish">Save & Finish</button></div></div>${state.lastSummary?summaryCard(state.lastSummary):''}`}
function exerciseCard(e,i){let [name,count,min,max,rir,optional]=e;let prev=latestFor(name);let pr=state.prs[name];let rows=Array.from({length:count},(_,j)=>{let d=state.draft[key(name,j)]||{};return `<div class="set"><div class="setno">S${j+1}</div>${inputCell('Weight (kg)',d.w,`data-name="${esc(name)}" data-set="${j}" data-field="w"`)}${inputCell('Reps',d.r,`data-name="${esc(name)}" data-set="${j}" data-field="r"`)}${inputCell('RIR',d.rir,`data-name="${esc(name)}" data-set="${j}" data-field="rir"`)}</div>`}).join('');let last=prev?prev.sets.map(s=>`${s.w}×${s.r} @${s.rir} RIR`).join(' · '):'No previous log';return `<section class="exercise"><div class="exercise-head"><div><div class="exercise-name">${esc(name)} ${optional?'<span class="pill">Optional</span>':''}</div><div class="meta">${count} × ${min}–${max} reps · target RIR ${rir}${rir===3?'–4':''}</div><div class="meta">Last: ${esc(last)}</div><div class="meta">Manual PR: ${pr?`${esc(pr.w)} kg × ${esc(pr.r)} reps @ ${esc(pr.rir)} RIR`:'Not entered'}${pr&&strengthEligible(name)?` · ${strengthInfo(name,+pr.w).ratio.toFixed(2)}× BW (${strengthInfo(name,+pr.w).tier})`:''}</div></div><span class="pill">${i+1}</span></div><div class="sets">${rows}</div></section>`}
function recommendation(e,sets,pr){let [name,count,min,max,target]=e;const done=sets.filter(s=>isNum(s.w)&&isNum(s.r)&&Number(s.r)>0&&isNum(s.rir));if(!done.length)return null;let weights=done.map(s=>+s.w),same=weights.every(w=>w===weights[0]);let allTop=done.length===count&&same&&done.every(s=>+s.r>=max&&+s.rir>=target);let lowRir=done.some(s=>+s.rir<target-1);let lowRep=done.some(s=>+s.r<min);let targetW=weights[0];let advice='';if(allTop)advice=`All ${count} sets reached ${max}+ reps at target RIR. Next ${name} session: consider the smallest available weight increase (typically 2–5%, machine permitting), then build again from ${min} reps.`;else if(lowRir)advice=`Effort was harder than planned. Repeat or slightly reduce the load next ${name} session; aim for RIR ${target} and controlled technique.`;else if(lowRep)advice=`Some sets fell below ${min} reps. Maintain or slightly reduce weight until all working sets reach the range with good form.`;else advice=`Keep approximately ${round(targetW)} kg next ${name} session and add 1 rep to one or more sets, working toward ${max} reps on every set at RIR ${target}+.`;if(!same)advice+=' Loads varied across sets; use a consistent working weight when practical.';if(pr&&+pr.w>Math.max(...weights))advice+=` Manual PR reference: ${pr.w} kg × ${pr.r} @${pr.rir} RIR. Do not rush to match it.`;return {name,advice,sets:done,pr:pr||null}}
function summaryCard(s){return `<div class="card"><div class="row between"><h2>Last saved: ${esc(s.session)} · ${esc(s.date)}</h2><span class="pill good">Saved</span></div><div class="notice">Next workout: <b>${esc(s.next)}</b>. Recommendations apply when each exercise comes around again in the rotation, not necessarily next calendar week.</div>${(s.recs||[]).map(r=>`<div class="result"><strong>${esc(r.name)}</strong><p>${esc(r.advice)}</p></div>`).join('')}</div>`}

const strengthEligible=name=>/SLDL|Hack Press|Upper Chest Press/.test(name);
const loadForRatio=(name,w)=>/per side/.test(name)?w*2:w;
function strengthInfo(name,w){let bw=Math.max(1,Number(state.profile.weight)||70),ratio=loadForRatio(name,w)/bw;let bounds=/SLDL/.test(name)?[.65,1,1.5,2]:/Hack Press/.test(name)?[.5,1,1.6,2.3]:[.3,.6,1,1.5];let labels=['Starter','Developing','Intermediate','Advanced','Elite'];let i=bounds.findIndex(x=>ratio<x);if(i<0)i=4;return {ratio,tier:labels[i],next:i<4?bounds[i]:null,bounds,description:/per side/.test(name)?'Plate load only (both sides combined), excluding sled weight. Not comparable across machines.':'External load divided by body weight. Not a validated strength standard.'}}
function stats(){let h=state.history||[],count=h.length;let sets=h.reduce((n,x)=>n+(x.entries||[]).reduce((k,e)=>k+(e.sets||[]).length,0),0);let volume=h.reduce((n,x)=>n+(x.entries||[]).reduce((k,e)=>k+(e.sets||[]).reduce((z,t)=>z+(+t.w||0)*(+t.r||0),0),0),0);let unique=[...new Set(h.map(x=>x.date))].sort();let streak=0;if(unique.length){streak=1;for(let i=unique.length-1;i>0;i--){let a=Date.parse(unique[i]+'T12:00:00Z'),b=Date.parse(unique[i-1]+'T12:00:00Z');if((a-b)/86400000<=7)streak++;else break}}let xp=count*100+sets*10;let level=Math.floor(xp/500)+1;return {count,sets,volume,streak,xp,level,levelProgress:xp%500}}
function journeyStrip(){let x=stats();return `<div class="card"><div class="row between"><div><div class="eyebrow">Your fitness journey</div><h2 style="margin:6px 0">Level ${x.level} · ${x.xp.toLocaleString()} XP</h2></div><button class="btn btnsmall" data-tab="profile">My Journey</button></div><div class="progress"><div style="width:${x.levelProgress/5}%"></div></div><p class="tiny muted">${500-x.levelProgress} XP to next level · ${x.count} workouts logged · ${x.streak} training-week consistency streak</p></div>`}
function profileView(){let x=stats(),bw=+state.profile.weight||70,ht=+state.profile.height||170;let feats=names.filter(strengthEligible);let badges=[['First Rep','Complete your first workout',x.count>=1],['Consistent','Log 4 workouts',x.count>=4],['Committed','Log 12 workouts',x.count>=12],['Century Club','Log 100 working sets',x.sets>=100],['Volume Builder','Log 10,000 kg of total set volume',x.volume>=10000],['Routine Builder','Train in 3 consecutive calendar weeks',x.streak>=3],['Journey Veteran','Log 50 workouts',x.count>=50]];return `<section class="hero"><div><div class="eyebrow">Progress & achievements</div><h1>My Journey</h1><div class="muted">Track relative strength and celebrate consistency.</div></div></section><div class="card"><h2>Body profile</h2><div class="grid2"><div class="field"><label>Body weight (kg)</label><input type="number" id="bodyweight" min="20" max="400" step="0.1" value="${esc(bw)}"></div><div class="field"><label>Height (cm)</label><input type="number" id="bodyheight" min="80" max="250" step="0.1" value="${esc(ht)}"></div></div><p class="tiny muted">Your weight is used to calculate load-to-bodyweight ratios. Height is saved as a profile reference; it does not determine strength tiers. Changes save automatically.</p></div><div class="grid"><div class="stat"><span class="tiny muted">LEVEL</span><b>${x.level}</b><span class="tiny muted">${x.xp.toLocaleString()} XP</span></div><div class="stat"><span class="tiny muted">WORKOUTS</span><b>${x.count}</b><span class="tiny muted">Completed</span></div><div class="stat"><span class="tiny muted">WORKING SETS</span><b>${x.sets}</b><span class="tiny muted">Logged</span></div><div class="stat"><span class="tiny muted">WEEK STREAK</span><b>${x.streak}</b><span class="tiny muted">Consecutive training weeks</span></div></div><div class="card" style="margin-top:14px"><h2>Level progression</h2><div class="progress"><div style="width:${x.levelProgress/5}%"></div></div><p class="tiny muted">${x.levelProgress} / 500 XP · ${500-x.levelProgress} XP until Level ${x.level+1}. Each completed session earns 100 XP, each logged working set earns 10 XP. No extra XP for failure or risky lifts.</p></div><div class="card"><h2>Strength-to-bodyweight milestones</h2><p class="tiny muted">Uses your manually entered PR weight, not estimated 1RM. These are custom motivational tiers, not ACSM or population-validated standards. Reps and RIR remain visible for context.</p>${feats.map(name=>{let pr=state.prs[name],info=pr&&isNum(pr.w)?strengthInfo(name,+pr.w):null;return `<div class="result"><strong>${esc(name)}</strong>${info?`<div class="row between"><span><b style="font-size:22px;color:#d8f26a">${info.ratio.toFixed(2)}× BW</b> · ${info.tier}</span><span class="pill">${esc(pr.w)} kg × ${esc(pr.r||'?')} @${esc(pr.rir??'?')} RIR</span></div><p>${info.next?`Next tier: ${info.next.toFixed(2)}× BW · approximately ${(info.next*bw/(/per side/.test(name)?2:1)).toFixed(1)} kg ${/per side/.test(name)?'per side':'total'} load.`:'Highest custom tier reached.'}</p><p>${info.description}</p>`:`<p>No manual PR yet. Add one under PR Benchmarks to unlock this metric.</p>`}</div>`}).join('')}</div><div class="card"><h2>Achievement cabinet</h2><div class="grid2">${badges.map(([name,desc,unlocked])=>`<div class="achievement ${unlocked?'':'locked'}"><span>${unlocked?'🏆':'🔒'}</span><b>${name}</b><span class="tiny muted">${desc}</span></div>`).join('')}</div></div><div class="notice">Strength labels are for personal motivation only. Machines differ in leverage and resistance; a 1.5× BW SLDL is not directly equivalent to a 1.5× BW hack press. Good form, recovery, and progressive training matter more than unlocking a tier.</div>`}
function prs(){return `<section class="hero"><div><div class="eyebrow">Manual reference</div><h1>PR Benchmarks</h1><div class="muted">Enter your best reference set even if it happened before you started using this app.</div></div></section><div class="notice" style="margin-bottom:16px">PRs are benchmarks, not automatic workout targets. Specify load consistently: hack press and calf raise are <b>kg per side</b>; barbell SLDL is <b>total kg</b>.</div><div class="card">${names.map(name=>{let p=state.prs[name]||{};return `<div class="exercise"><div class="exercise-name">${esc(name)}</div><div class="set" style="margin-top:9px"><div class="setno">PR</div>${inputCell('Weight kg',p.w,`data-pr="${esc(name)}" data-field="w"`)}${inputCell('Reps',p.r,`data-pr="${esc(name)}" data-field="r"`)}${inputCell('RIR',p.rir,`data-pr="${esc(name)}" data-field="rir"`)}</div></div>`}).join('')}<button class="btn primary" id="saveprs">Save PR Benchmarks</button></div>`}
function historyView(){return `<section class="hero"><div><div class="eyebrow">Training archive</div><h1>Workout history</h1><div class="muted">${state.history.length} completed sessions, newest first</div></div></section><div class="card">${!state.history.length?'<div class="empty">No workouts saved yet. Finish your first session to see it here.</div>':state.history.slice().reverse().map((h,i)=>`<div class="history-item"><div class="row between"><div><b>${esc(h.session)}</b> <span class="muted tiny">${esc(h.date)}</span></div><button class="btn btnsmall" data-expand="${i}">${expandedHistory===i?'Hide':'Details'}</button></div>${expandedHistory===i?`<p class="tiny muted">${esc(h.notes||'No session notes')}</p>${h.entries.map(e=>`<div class="result"><strong>${esc(e.name)}</strong><p>${e.sets.map(s=>`${s.w} kg × ${s.r} reps @${s.rir} RIR`).join(' · ')}</p></div>`).join('')}<div class="notice">${h.recs.map(r=>esc(r.name)+': '+esc(r.advice)).join(' | ')||'No recommendations'}</div>`:''}</div>`).join('')}</div>`}
function settings(){return `<section class="hero"><div><div class="eyebrow">Storage & portability</div><h1>Your training data</h1><div class="muted">Stored locally in this browser, on this device.</div></div></section><div class="card"><h2>Backup and restore</h2><p class="muted">Export a JSON backup regularly. Import it on another device or browser to continue your history. This app does not sync automatically.</p><div class="row"><button class="btn primary" id="export">Export backup</button><label class="btn" for="importfile" style="cursor:pointer">Import backup</label><input id="importfile" type="file" accept="application/json,.json"></div></div><div class="card"><h2>Rotation control</h2><p class="muted">Current: <b>${current()}</b>. Choose any workout from the Workout tab. Finishing advances to the following session. You can also step back below.</p><button class="btn" id="undo">Go back one rotation step</button></div><div class="card"><h2>Reset</h2><p class="muted">Permanently clears local workout logs, PRs, and rotation position. Export first if needed.</p><button class="btn danger" id="reset">Erase local data</button></div><div class="footer">Offline-friendly single HTML file · No account, server, or cloud storage · Recommendations are rule-based, not medical advice.</div>`}
function updateField(el){if(el.id==='bodyweight'||el.id==='bodyheight'){let v=Number(el.value);if(Number.isFinite(v)&&v>0){state.profile[el.id==='bodyweight'?'weight':'height']=v;save()}return}if(el.id==='date'){state.date=el.value;save();return}if(el.id==='notes'){state.notes=el.value;save();return}if(el.dataset.name){let k=key(el.dataset.name,el.dataset.set);state.draft[k]??={};state.draft[k][el.dataset.field]=el.value;save();return}if(el.dataset.pr){let n=el.dataset.pr;state.prs[n]??={};state.prs[n][el.dataset.field]=el.value;save()}}
document.addEventListener('input',ev=>{let e=ev.target;if(e.matches('input,textarea'))updateField(e)});
document.addEventListener('change',ev=>{let e=ev.target;if(e.id==='rotationSelect'){const chosen=Number(e.value);if(!Number.isInteger(chosen)||chosen<0||chosen>=ORDER.length)return;if(chosen!==state.index%ORDER.length){if(Object.values(state.draft||{}).some(v=>Object.values(v).some(x=>x!==''))&&!confirm('Switch workout? Unsaved set entries will be cleared. Your saved history and PRs will remain.')){render();return}state.index=chosen;state.draft={};state.notes='';save();render()}return}if(e.id==='importfile'){let f=e.files[0];if(!f)return;f.text().then(t=>{let data=JSON.parse(t);if(!Array.isArray(data.history)||!data.prs||!Number.isInteger(data.index))throw Error('Invalid backup');if(confirm('Replace all current data with this backup?')){state=Object.assign({draft:{},notes:'',lastSummary:null,profile:{weight:70,height:170}},data);state.profile=Object.assign({weight:70,height:170},state.profile||{});save();render();alert('Backup restored.')}}).catch(err=>alert('Could not import: '+err.message));return}if(e.matches('input,textarea'))updateField(e)});
document.addEventListener('click',ev=>{let b=ev.target.closest('button');if(!b)return;if(b.dataset.tab){tab=b.dataset.tab;render();return}if(b.dataset.expand!==undefined){expandedHistory=expandedHistory===+b.dataset.expand?-1:+b.dataset.expand;render();return}if(b.id==='saveprs'){save();alert('PR benchmarks saved.');return}if(b.id==='finish'){const session=current(),date=state.date||new Date().toISOString().slice(0,10);let entries=exercises().map(e=>({name:e[0],sets:Array.from({length:e[1]},(_,j)=>state.draft[key(e[0],j)]||{}).filter(s=>isNum(s.w)&&isNum(s.r)&&+s.r>0&&isNum(s.rir)).map(s=>({w:+s.w,r:+s.r,rir:+s.rir}))})).filter(e=>e.sets.length);if(!entries.length){alert('Enter at least one complete working set (weight, reps, RIR).');return}let incomplete=exercises().some(e=>!e[5]&&entries.find(x=>x.name===e[0])?.sets.length!==e[1]);if(incomplete&&!confirm('Some core working sets are incomplete. Save this workout anyway?'))return;let recs=entries.map(x=>recommendation(exercises().find(e=>e[0]===x.name),x.sets,state.prs[x.name])).filter(Boolean);let next=ORDER[(state.index+1)%ORDER.length];let h={session,date,notes:state.notes,entries,recs,next,createdAt:new Date().toISOString()};state.history.push(h);state.lastSummary={session,date,recs,next};state.index=(state.index+1)%ORDER.length;state.draft={};state.notes='';state.date='';save();render();window.scrollTo(0,0);return}if(b.id==='export'){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='ppl-training-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);return}if(b.id==='undo'){if(confirm('Move rotation back one session? This does not delete any workout history.')){state.index=(state.index-1+ORDER.length)%ORDER.length;save();render()}return}if(b.id==='reset'){if(confirm('Erase ALL local training data? This cannot be undone.')){localStorage.removeItem(KEY);state={index:0,history:[],prs:{},draft:{},notes:'',lastSummary:null,profile:{weight:70,height:170}};tab='today';render()}}});render();
</script></body></html>
